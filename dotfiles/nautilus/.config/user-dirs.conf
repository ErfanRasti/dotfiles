# Only stops xdg-user-dirs-update from rewriting user-dirs.dirs; the folders
# themselves still work. At login it resets missing folders to $HOME, e.g.
# ~/Music (a link to the external drive) when the drive is unplugged. Then
# LocalSearch indexes all of ~ as "Music" and the stow link gets replaced.
# To change folders, edit user-dirs.dirs in the dotfiles by hand.
enabled=False
