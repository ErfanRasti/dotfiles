# Auto-generated by Matugen

set -gq @thm_bar_bg                       "{{colors.surface.default.hex}}"

set -gq @thm_bg                           "{{colors.surface.default.hex}}"
set -gq @thm_fg                           "{{colors.on_surface.default.hex}}"
set -gq @thm_primary                      "{{colors.primary.default.hex}}"
set -gq @thm_inverse_primary              "{{colors.inverse_primary.default.hex}}"
set -gq @thm_surface_low                  "{{colors.surface_container_low.default.hex}}"
set -gq @thm_surface                      "{{colors.surface_container.default.hex}}"
set -gq @thm_surface_variant              "{{colors.surface_container_high.default.hex}}"
set -gq @thm_outline                      "{{colors.outline_variant.default.hex}}"
set -gq @thm_text_variant                 "{{colors.on_surface_variant.default.hex}}"

# --> Catppuccin palette overridden with matugen colors
# The catppuccin plugin reads these names, so without them it keeps the
# (dark) mocha palette even in light mode.
## Accents
set -gq @thm_rosewater                    "{{colors.primary.default.hex}}"
set -gq @thm_flamingo                     "{{colors.pink.default.hex}}"
set -gq @thm_pink                         "{{colors.pink.default.hex}}"
set -gq @thm_mauve                        "{{colors.purple.default.hex}}"
set -gq @thm_red                          "{{colors.red.default.hex}}"
set -gq @thm_maroon                       "{{colors.tertiary.default.hex}}"
set -gq @thm_peach                        "{{colors.orange.default.hex}}"
set -gq @thm_yellow                       "{{colors.yellow.default.hex}}"
set -gq @thm_green                        "{{colors.green.default.hex}}"
set -gq @thm_teal                         "{{colors.mint.default.hex}}"
set -gq @thm_sky                          "{{colors.cyan.default.hex}}"
set -gq @thm_sapphire                     "{{colors.teal.default.hex}}"
set -gq @thm_blue                         "{{colors.blue.default.hex}}"
set -gq @thm_lavender                     "{{colors.indigo.default.hex}}"
## Surfaces and overlays
set -gq @thm_subtext_1                    "{{colors.on_surface_variant.default.hex}}"
set -gq @thm_subtext_0                    "{{colors.on_surface_variant.default.hex}}"
set -gq @thm_overlay_2                    "{{colors.outline.default.hex}}"
set -gq @thm_overlay_1                    "{{colors.outline.default.hex}}"
set -gq @thm_overlay_0                    "{{colors.outline.default.hex}}"
set -gq @thm_surface_2                    "{{colors.outline_variant.default.hex}}"
set -gq @thm_surface_1                    "{{colors.surface_container_highest.default.hex}}"
set -gq @thm_surface_0                    "{{colors.surface_container_high.default.hex}}"
# mantle = catppuccin's solid bar color (unused while @catppuccin_status_background is "none")
set -gq @thm_mantle                       "{{colors.surface.default.hex}}"
# crust = text on top of accent colors (window numbers, module icons)
set -gq @thm_crust                        "{{colors.surface_container_lowest.default.hex}}"

# Keep the pane and status bar on the terminal's default background so kitty's
# transparency shows through (an explicit bg color would be opaque)
set -g window-active-style                "default"
set -g status-style                       "default"

# Catppuccin bakes colors into its formats when it loads, so rebuild them.
# Module colors it only sets once (set -o) are unset first so they pick up the new palette.
run-shell 'for m in application battery clima cpu date_time directory gitmux host kube load pomodoro_plus session uptime user weather; do tmux set -gu "@catppuccin_status_${m}_icon_fg" \; set -gu "@catppuccin_status_${m}_text_fg"; done; ~/.config/tmux/plugins/tmux/catppuccin.tmux'
