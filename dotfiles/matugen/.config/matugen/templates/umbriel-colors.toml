# Generated by matugen from ~/.config/matugen/templates/umbriel-colors.toml
# Do not edit ~/.config/umbriel/config/colors.toml by hand.

[colors]
accent_primary = "{{colors.primary.default.hex}}ff"
accent_secondary = "{{colors.tertiary.default.hex}}ff"
background = "{{colors.surface.default.hex}}ff"
text_primary = "{{colors.on_surface.default.hex}}ff"
text_muted = "{{colors.on_surface_variant.default.hex}}ff"
error = "{{colors.error.default.hex}}ff"
warning = "{{colors.tertiary.default.hex}}ff"
shadow = "{{colors.shadow.default.hex}}70"
insert_hint = "{{colors.primary_container.default.hex}}80"

[colors.border]
focused = "{{colors.primary.default.hex}}ff"
unfocused = "{{colors.secondary_container.default.hex}}ff"
outer = "{{colors.surface_container.default.hex}}ff"

[colors.tab_bar]
active = "{{colors.primary.default.hex}}ff"
active_text = "{{colors.on_primary.default.hex}}ff"
active_unfocused = "{{colors.secondary_container.default.hex}}ff"
active_unfocused_text = "{{colors.on_secondary_container.default.hex}}ff"
background = "{{colors.surface_container.default.hex}}ff"
text = "{{colors.on_surface_variant.default.hex}}ff"
urgent = "{{colors.error.default.hex}}ff"
urgent_text = "{{colors.on_error.default.hex}}ff"

[colors.overview]
badge = "{{colors.primary.default.hex}}ff"

# Indicate screencasted windows with error colors.
[[window_rule]]
match.is_cast_target = true
border_color_focused = "{{colors.error.default.hex}}ff"
border_color_unfocused = "{{colors.error_container.default.hex}}ff"

# Scratchpad windows use the tertiary accent.
[[window_rule]]
match.is_scratchpad = true
border_color_focused = "{{colors.tertiary.default.hex}}ff"
border_color_unfocused = "{{colors.tertiary_container.default.hex}}ff"

# Title bars (stacking layout). Neutral translucent bar; buttons are traffic lights taken from
# the theme: close = error (the theme's red), minimize = yellow, maximize = green. yellow/green
# are matugen custom colours with blend = true (config.toml), so they're harmonised with the
# wallpaper and have light/dark variants. Glyphs use the matching "on_" tone.
[colors.title_bar]
# Neutral Material surface tones (they carry only a faint hint of the accent) at ~80% focused /
# ~70% unfocused, with a little blur showing through. Material roles -> follows light/dark mode.
background = "{{colors.surface_container_high.default.hex}}cc"
background_unfocused = "{{colors.surface_container.default.hex}}b3"
text = "{{colors.on_surface.default.hex}}ff"
text_unfocused = "{{colors.outline.default.hex}}ff"
close = "{{colors.error.default.hex}}ff"
close_glyph = "{{colors.on_error.default.hex}}b3"
close_glyph_hover = "{{colors.on_error.default.hex}}ff"
minimize = "{{colors.yellow.default.hex}}ff"
minimize_glyph = "{{colors.on_yellow.default.hex}}b3"
minimize_glyph_hover = "{{colors.on_yellow.default.hex}}ff"
maximize = "{{colors.green.default.hex}}ff"
maximize_glyph = "{{colors.on_green.default.hex}}b3"
maximize_glyph_hover = "{{colors.on_green.default.hex}}ff"
