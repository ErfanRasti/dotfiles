# See https://sw.kovidgoyal.net/kitty/conf/#color-scheme
# Every color below must be readable in both modes, so only roles whose tone
# flips with the mode (or explicit .dark variants) are used. Raw *_value colors
# and *_fixed roles stay the same in light mode and wash out on a light background.

cursor {{colors.purple_container.default.hex}}
cursor_text_color {{colors.on_purple_container.default.hex}}

background            {{colors.surface.default.hex}}
foreground            {{colors.on_surface.default.hex}}
selection_background  {{colors.secondary_container.default.hex}}
selection_foreground  {{colors.on_secondary_container.default.hex}}
url_color             {{colors.tertiary.default.hex}}

active_tab_background {{colors.primary.default.hex}}
active_tab_foreground {{colors.on_primary.default.hex}}
inactive_tab_background {{colors.secondary_container.default.hex}}
inactive_tab_foreground {{colors.on_secondary_container.default.hex}}

active_border_color {{colors.primary.default.hex}}
inactive_border_color {{colors.secondary_container.default.hex}}

# First one is normal and the second one is bright
# See https://sw.kovidgoyal.net/kitty/conf/#the-color-table
# Normal = the custom color's role (tone 80 dark / 40 light). Bright = its
# on-container nudged by auto_lightness: a vivid pastel in dark mode, a deep
# saturated shade in light mode (light themes darken brights, like GitHub Light).

# black: a dark grey in both modes, so "black" text stays visible in light mode
color0   {{colors.surface_container_highest.dark.hex}}
color8   {{colors.outline.default.hex}}

# red
color1   {{colors.red.default.hex}}
color9   {{colors.on_red_container.default.hex | auto_lightness: 12.0}}

# green
color2   {{colors.green.default.hex}}
color10  {{colors.on_green_container.default.hex | auto_lightness: 12.0}}

# yellow
color3   {{colors.yellow.default.hex}}
color11  {{colors.on_yellow_container.default.hex | auto_lightness: 12.0}}

# blue
color4   {{colors.blue.default.hex}}
color12  {{colors.on_blue_container.default.hex | auto_lightness: 12.0}}

# magenta
color5   {{colors.purple.default.hex}}
color13  {{colors.on_purple_container.default.hex | auto_lightness: 12.0}}

# cyan
color6   {{colors.cyan.default.hex}}
color14  {{colors.on_cyan_container.default.hex | auto_lightness: 12.0}}

# white: the foreground side of the palette, so it reads on a light background too
color7   {{colors.on_surface_variant.default.hex}}
color15  {{colors.on_surface.default.hex}}

# extended colors
color16  {{colors.orange.default.hex}}
color17  {{colors.on_orange_container.default.hex | auto_lightness: 12.0}}

# Material roles on fixed palette slots. TUIs that reference these indexes
# (the yazi theme does) repaint the moment kitty reloads, with no restart.
# Only roles the yazi theme needs; on_surface_variant/outline are ANSI 7/8.
color18 {{colors.primary.default.hex}}
color19 {{colors.on_primary.default.hex}}
color20 {{colors.secondary.default.hex}}
color21 {{colors.on_secondary.default.hex}}
color22 {{colors.tertiary.default.hex}}
color23 {{colors.on_tertiary.default.hex}}
color24 {{colors.tertiary_container.default.hex}}
color25 {{colors.on_tertiary_container.default.hex}}
color26 {{colors.error.default.hex}}
color27 {{colors.error_container.default.hex}}
color28 {{colors.on_error_container.default.hex}}
color29 {{colors.surface_container_highest.default.hex}}
color30 {{colors.outline_variant.default.hex}}
color31 {{colors.surface_container_high.default.hex}}
