# Umbriel configuration (TOML), ported from ~/.config/niri/config.kdl
#
# Reference:  https://docs.noctalia.dev/umbriel/
# Validate:   umbriel config validate
# Schema:     umbriel config schema --json
# Actions:    umbriel msg --help
#
# Most changes apply as soon as a file is saved.
# Files are split the same way as the niri config. Paths are relative to this file.

[include]
files = [
  "config/input.toml",
  "config/outputs.toml",
  "config/envvars.toml",
  "config/autostarts.toml",
  "config/layout.toml",
  "config/workspaces.toml",
  "config/appearance.toml",
  "config/binds.toml",
  "config/rules.toml",
  "config/noctalia.toml",
  # Custom effects (paths are relative to this file)
  "effects/liquid_glass/effect.toml",
  "effects/spotify_wave/effect.toml",
  "config/glass.toml",
]

[include.optional]
files = [
  # Workspace list + per-workspace layouts, kept by scripts/set_layout.py
  # (created from config/workspaces.defaults.toml at login if missing)
  "config/workspaces.state.toml",
  # Generated by matugen (~/.config/matugen/templates/umbriel-colors.toml)
  "config/colors.toml",
  # Machine-local / script-managed overrides (see scripts/toggle_center_focus.sh)
  "config/overwrites.toml",
  # Title bars on/off, written by scripts/stacking_watch.py (on while a stacking workspace is focused)
  "config/titlebar.toml",
]
