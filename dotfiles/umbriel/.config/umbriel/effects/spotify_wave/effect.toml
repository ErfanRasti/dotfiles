# Audio-reactive "oscilloscope" border (64-band standing wave along the left/right edges),
# used on Spotify only (see config/glass.toml). Needs an audio source: noctalia's umbriel
# audio provider ([shell] umbriel_audio_provider_enabled = true in noctalia settings.toml).
# Not animated on its own: it only redraws when new audio data arrives, so it costs nothing
# while nothing is playing.
#
# The shader is generated by matugen/noctalia (theme primary/secondary/tertiary baked in) from
# ~/.config/matugen/templates/umbriel-spotify-wave.glsl into config/ next to colors.toml.
# GLSL here has no #include, and umbriel's effect palette ends in the error red, hence this.
[effects.preset.spotify_wave]
kind = "border"
shader = "../../config/spotify_wave.glsl"
padding = 18       # room for the wave (max 11 px out), its glow and the window shadow
animated = false
