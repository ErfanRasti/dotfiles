# Audio-reactive "oscilloscope" border (64-band standing wave along the left/right edges),
# used on Spotify only (see config/rules.toml). Needs an audio source: noctalia's umbriel
# audio provider ([shell] umbriel_audio_provider_enabled = true in noctalia settings.toml).
# Not animated on its own: it only redraws when new audio data arrives, so it costs nothing
# while nothing is playing.
[effects.preset.spotify_wave]
kind = "border"
shader = "shader.glsl"
palette = true     # colours follow the theme (accent/secondary/warning/error)
padding = 18       # room for the wave (max 11 px out), its glow and the window shadow
animated = false
