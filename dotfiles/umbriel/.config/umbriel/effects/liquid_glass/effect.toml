# macOS-like "liquid glass" feel, drawn as a WINDOW effect on top of umbriel's built-in blur.
# It never moves or blurs pixels (text stays sharp). It only adds light near the window edges:
#   - a soft specular rim, brightest on the top-left (light) side,
#   - a faint shade on the bottom-right inner edge for depth,
#   - a light gloss across the top of the window,
#   - slightly thinner alpha along the edges so the backdrop blur shows through more there.
# Shaders can't read what is behind a window, so the frost itself is appearance.blur.
# Select globally with [effects] window = "liquid_glass" (config/glass.toml),
# or per window with [[window_rule]] window_effect = "liquid_glass".
[effects.preset.liquid_glass]
kind = "window"
shader = "shader.glsl"
