# Keybinds (niri: config/binds.kdl).
# Syntax:  https://docs.noctalia.dev/umbriel/keybinds/
# Actions: `umbriel msg --help`
#
# Defining [keybinds] replaces umbriel's built-in bind set.
# Shell/panel binds (volume, brightness, screenshots, launcher, ...) are in config/noctalia.toml.
# NOTE: keep each chord in ONE file only; don't define the same chord twice across includes.
#
# Not available in umbriel (niri-only, dropped): touchpad-scroll binds,
# expand-column-to-available-width, center-visible-columns, toggle-windowed-fullscreen,
# reset-window-height, screenshot-window, MRU recent-windows switcher.

[keybinds]

# ============================================================== Layouts (NEW)
# Switch the active workspace's layout mode (scripts/set_layout.py notifies, and tidies
# windows into halves/quarters when entering stacking).
"Mod+F1" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py scrolling", repeat = false }
"Mod+F2" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py stacking", repeat = false }
"Mod+F3" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py dwindle", repeat = false }
"Mod+F4" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py master", repeat = false }
"Mod+F5" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py toggle", repeat = false }
# Same, for ALL workspaces at once
"Mod+Shift+F1" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py --all scrolling", repeat = false }
"Mod+Shift+F2" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py --all stacking", repeat = false }
"Mod+Shift+F3" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py --all dwindle", repeat = false }
"Mod+Shift+F4" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py --all master", repeat = false }
"Mod+Shift+F5" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py --all toggle", repeat = false }

# Layout-specific helpers
"Mod+Alt+T" = { action = "layout-toggle-split", repeat = false } # dwindle: flip split direction
"Mod+Ctrl+Equal" = "layout-master-count-increase"                # master: one more master window
"Mod+Ctrl+Minus" = "layout-master-count-decrease"                # master: one less master window
"Mod+Alt+Return" = "window-swap-next"                            # swap with next (master/dwindle)
# Swap with neighbour (useful in dwindle/master)
"Mod+Ctrl+Alt+Left" = "window-swap-left"
"Mod+Ctrl+Alt+Right" = "window-swap-right"
"Mod+Ctrl+Alt+Up" = "window-swap-up"
"Mod+Ctrl+Alt+Down" = "window-swap-down"
"Mod+Ctrl+Alt+K" = "window-swap-up"
"Mod+Ctrl+Alt+J" = "window-swap-down"
# Stacking: snap the focused window into halves
"Mod+Ctrl+Alt+Shift+Left" = { action = "window-set-region left", repeat = false }
"Mod+Ctrl+Alt+Shift+Right" = { action = "window-set-region right", repeat = false }
"Mod+Ctrl+Alt+Shift+Up" = { action = "window-set-region top", repeat = false }
"Mod+Ctrl+Alt+Shift+Down" = { action = "window-set-region bottom", repeat = false }
"Mod+Alt+Shift+C" = { action = "window-clear-region", repeat = false }

# ============================================================== Apps & session
"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }                                                                                                 # niri: show-hotkey-overlay
"Mod+T" = { action = "spawn kitty --app-id kitty-main", repeat = false }
"Mod+Return" = { action = "spawn kitty", repeat = false }
"Mod+D" = { action = "spawn ~/.config/hypr/scripts/toggle_rofi_launcher.sh", repeat = false }
"Mod+I" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh org.gnome.Settings env XDG_CURRENT_DESKTOP=GNOME gnome-control-center", repeat = false }
"Mod+E" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh org.gnome.Nautilus env XDG_CURRENT_DESKTOP=GNOME nautilus", repeat = false }
"Mod+Alt+E" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh yazi kitty --override confirm_os_window_close=0 --class yazi bash -c yazi", repeat = false }
"Mod+Grave" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh kitty-dropterm kitty --class kitty-dropterm --title kitty-dropterm", repeat = false }

# System monitors (open floating; same key again -> scratchpad)
"Ctrl+Shift+Escape" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh btop kitty --override confirm_os_window_close=0 --class btop -e btop", repeat = false }
"Ctrl+Shift+F1" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh nvtop kitty --override confirm_os_window_close=0 --class nvtop -e nvtop", repeat = false }
"Ctrl+Shift+F2" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh org.gnome.SystemMonitor gnome-system-monitor", repeat = false }
"Ctrl+Shift+F3" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh io.missioncenter.MissionCenter missioncenter", repeat = false }
"Ctrl+Shift+F4" = { action = "spawn ~/.config/umbriel/scripts/toggle_app.sh htop kitty --override confirm_os_window_close=0 --class htop -e htop", repeat = false }

# Rofi applets
"Mod+Alt+A" = "spawn ~/.config/rofi/applets/scripts/apps.sh"
"Mod+Alt+Shift+A" = "spawn ~/.config/rofi/applets/scripts/appsasroot.sh"
"Mod+Alt+Q" = "spawn ~/.config/rofi/applets/scripts/quicklinks.sh"
"Mod+Ctrl+B" = "spawn ~/.config/rofi/applets/scripts/battery.sh"
"Mod+Alt+V" = "spawn ~/.config/rofi/applets/scripts/volume.sh"
"Mod+Alt+B" = "spawn ~/.config/rofi/applets/scripts/brightness.sh"
"Mod+Alt+P" = "spawn ~/.config/rofi/applets/scripts/player.sh"
"Mod+Shift+Escape" = "spawn ~/.config/rofi/powermenu/run.sh"
"Mod+Ctrl+P" = "spawn ~/.config/rofi/applets/scripts/powermenu.sh"

# Music / visualizer
"Mod+Alt+Ctrl+P" = { action = "spawn kitty --title fum fum", repeat = false }
"Mod+Alt+Ctrl+C" = { action = "spawn kitty --title cava cava", repeat = false }

"Mod+R" = { action = "spawn ~/.config/umbriel/scripts/reload_config.sh", repeat = false }
"Mod+Shift+Q" = { action = "session-quit", repeat = false }
"Mod+Shift+P" = { action = "dpms-off", repeat = false }
# Escape hatch so a buggy app can't hold shortcuts hostage.
"Mod+Ctrl+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# ============================================================== Windows
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+F" = { action = "window-toggle-floating", repeat = false }
"Mod+Tab" = "spawn ~/.config/umbriel/scripts/scratchpad_cycle.sh focus" # next window in the open scratchpad, else floating<->tiled
"Mod+G" = { action = "column-toggle-tabbed", repeat = false }
# Switch between the tabs of a tab group (wraps around at the ends)
"Mod+Ctrl+Alt+H" = "column-focus-tab-previous"
"Mod+Ctrl+Alt+L" = "column-focus-tab-next"
"Mod+Alt+G" = { action = "column-toggle-tab-bar", repeat = false }
"Mod+Alt+Shift+G" = { action = "effect-border-toggle", repeat = false } # liquid glass edge on/off (config/glass.toml)
"Mod+Alt+Shift+P" = { action = "window-toggle-pinned", repeat = false }

"Mod+M" = { action = "window-toggle-maximize", repeat = false }                # maximize-column
"Mod+Shift+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
# Minimize (floating/stacking windows only; also the title-bar button) and bring the last one back
"Mod+Ctrl+M" = { action = "window-minimize", repeat = false }
"Mod+Alt+M" = { action = "window-restore-minimized", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }

"Mod+C" = { action = "spawn ~/.config/umbriel/scripts/toggle_center_focus.sh", repeat = false } # toggle center focus
"Mod+Shift+C" = "column-center"

# Width / height presets and fine adjustments
"Mod+Alt+R" = "window-cycle-primary-extent"               # switch-preset-column-width
"Mod+Shift+R" = "window-cycle-secondary-extent"           # switch-preset-window-height
"Mod+Ctrl+R" = "window-cycle-primary-extent-back"
"Mod+Minus" = "window-modify-primary-extent -0.1"
"Mod+Equal" = "window-modify-primary-extent +0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent +0.1"

# Consume / expel
"Mod+Alt+H" = "window-consume-or-expel-left"
"Mod+Alt+L" = "window-consume-or-expel-right"
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Alt+Left" = "window-consume-or-expel-left"
"Mod+Alt+Right" = "window-consume-or-expel-right"

# Recent windows: noctalia's MRU window switcher (like niri's Alt+Tab); hold Alt, tap Tab.
"Alt+Tab" = { action = "spawn noctalia msg window-switcher hold", repeat = false }
# Alt+Shift+Tab also opens the switcher (like Alt+Tab). Because umbriel consumes bound keys,
# it can't step backwards inside the open switcher; use Left/Right arrows there for that.
"Alt+Shift+Tab" = { action = "spawn noctalia msg window-switcher hold", repeat = false }
"Alt+Grave" = "window-focus-last"                                                        # straight back to the previous window
"Alt+Shift+Grave" = "window-focus-previous"                                              # previous window in layout order

# ============================================================== Focus
# Mod+H/J/K/L (and arrows): inside a shown scratchpad they move between its windows; Mod+H/L
# step through a tab group's tabs before the next column; otherwise the usual focus
# (scripts/focus.sh).
"Mod+Left" = "spawn ~/.config/umbriel/scripts/focus.sh left"
"Mod+Right" = "spawn ~/.config/umbriel/scripts/focus.sh right"
"Mod+Up" = "spawn ~/.config/umbriel/scripts/focus.sh up"
"Mod+Down" = "spawn ~/.config/umbriel/scripts/focus.sh down"
"Mod+H" = "spawn ~/.config/umbriel/scripts/focus.sh left"
"Mod+L" = "spawn ~/.config/umbriel/scripts/focus.sh right"
"Mod+K" = "spawn ~/.config/umbriel/scripts/focus.sh up"
"Mod+J" = "spawn ~/.config/umbriel/scripts/focus.sh down"

"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"

# ============================================================== Move
# Floating/stacking windows move 5% of the screen per press; tiled ones move as usual
# (scripts/move_window.sh).
"Mod+Ctrl+Left" = "spawn ~/.config/umbriel/scripts/move_window.sh left"
"Mod+Ctrl+Right" = "spawn ~/.config/umbriel/scripts/move_window.sh right"
"Mod+Ctrl+Up" = "spawn ~/.config/umbriel/scripts/move_window.sh up"
"Mod+Ctrl+Down" = "spawn ~/.config/umbriel/scripts/move_window.sh down"
"Mod+Ctrl+H" = "spawn ~/.config/umbriel/scripts/move_window.sh left"
"Mod+Ctrl+L" = "spawn ~/.config/umbriel/scripts/move_window.sh right"
"Mod+Ctrl+K" = "spawn ~/.config/umbriel/scripts/move_window.sh up"
"Mod+Ctrl+J" = "spawn ~/.config/umbriel/scripts/move_window.sh down"

"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

# ============================================================== Monitors
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+H" = "output-focus-left"
"Mod+Shift+L" = "output-focus-right"
"Mod+Shift+K" = "output-focus-up"
"Mod+Shift+J" = "output-focus-down"

"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"

"Mod+Shift+Alt+Left" = "workspace-move-to-output-left"
"Mod+Shift+Alt+Right" = "workspace-move-to-output-right"
"Mod+Shift+Alt+Up" = "workspace-move-to-output-up"
"Mod+Shift+Alt+Down" = "workspace-move-to-output-down"
"Mod+Shift+Alt+H" = "workspace-move-to-output-left"
"Mod+Shift+Alt+L" = "workspace-move-to-output-right"
"Mod+Shift+Alt+K" = "workspace-move-to-output-up"
"Mod+Shift+Alt+J" = "workspace-move-to-output-down"

# ============================================================== Workspaces
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"
# Move the focused window straight to the next / previous workspace (any layout, incl.
# stacking; you follow it). Same keys as niri's move-column-to-workspace-down/up.
"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+I" = "column-move-to-workspace-previous"

"Mod+Shift+Page_Down" = "workspace-move-down"
"Mod+Shift+Page_Up" = "workspace-move-up"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"
# "Mod+Alt+J" = "workspace-move-down"
# "Mod+Alt+K" = "workspace-move-up"
"Mod+Alt+Down" = "workspace-move-down"
"Mod+Alt+Up" = "workspace-move-up"

"Mod+P" = "workspace-focus-last" # niri: focus-workspace-previous

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Ctrl+1" = "column-move-to-workspace 1"
"Mod+Ctrl+2" = "column-move-to-workspace 2"
"Mod+Ctrl+3" = "column-move-to-workspace 3"
"Mod+Ctrl+4" = "column-move-to-workspace 4"
"Mod+Ctrl+5" = "column-move-to-workspace 5"
"Mod+Ctrl+6" = "column-move-to-workspace 6"
"Mod+Ctrl+7" = "column-move-to-workspace 7"
"Mod+Ctrl+8" = "column-move-to-workspace 8"
"Mod+Ctrl+9" = "column-move-to-workspace 9"
"Mod+Shift+1" = "column-move-to-workspace 1"
"Mod+Shift+2" = "column-move-to-workspace 2"
"Mod+Shift+3" = "column-move-to-workspace 3"
"Mod+Shift+4" = "column-move-to-workspace 4"
"Mod+Shift+5" = "column-move-to-workspace 5"
"Mod+Shift+6" = "column-move-to-workspace 6"
"Mod+Shift+7" = "column-move-to-workspace 7"
"Mod+Shift+8" = "column-move-to-workspace 8"
"Mod+Shift+9" = "column-move-to-workspace 9"

# ============================================================== Scratchpad (umbriel native)
# umbriel's default scratchpad (native actions). While it is shown, the rest of the screen
# blurs + dims ([animation.scratchpad]). App shortcuts (yazi, btop, ...) send their window
# here when pressed on it (scripts/toggle_app.sh).
"Mod+W" = { action = "spawn ~/.config/umbriel/scripts/scratchpad_window.sh", repeat = false }                     # store / take out (follows it, closes the scratchpad)
"Mod+Shift+W" = { action = "spawn ~/.config/umbriel/scripts/set_layout.py --scratchpad default", repeat = false } # show (cascaded) / hide
"Mod+Ctrl+W" = { action = "window-restore-from-scratchpad", repeat = false }                                      # just take it out (scratchpad stays open, no follow)
"Mod+Shift+Tab" = "spawn ~/.config/umbriel/scripts/scratchpad_cycle.sh show"                                      # show the open scratchpad's windows one at a time

# ============================================================== Mouse wheel
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }

"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"
