# Appearance and animations (niri: config/appearance.kdl + layout look + misc.kdl).
# https://docs.noctalia.dev/umbriel/appearance/
# https://docs.noctalia.dev/umbriel/animation/
# Colors live in config/colors.toml (generated by matugen).

[appearance]
border_width = 2        # niri: border { width 2 } (focus-ring is off)
corner_radius = 10      # niri: geometry-corner-radius 10
prefer_no_csd = true    # niri: prefer-no-csd
opaque_fullscreen = true

[appearance.shadow]
enabled = true
softness = 10
offset_x = 0
offset_y = 5

# Liquid-glass frost: wide, vivid and slightly brightened (see config/glass.toml).
[appearance.blur]
enabled = true
passes = 3
radius = 9
noise = 0.03            # fine grain keeps the glass from looking banded
saturation = 1.8        # vivid colours bleeding through, like macOS
brightness = 1.05
contrast = 0.95

# niri: tab-indicator { place-within-column }
# Tab groups (Mod+G): titled tabs in the same font as noctalia / the title bars.
# Switch tabs with Mod+Ctrl+Alt+H / Mod+Ctrl+Alt+L (or click / scroll the bar);
# Mod+Alt+H / Mod+Alt+L move a window into / out of the group.
[appearance.tab_bar]
style = "titles"
font = "CaskaydiaCove NF Bold 10"
height = 26
padding = 10
tab_gap = 3
title_align = "center"
hide_when_single = false
overflow = "scroll"

# Title bars: off by default (like niri). scripts/stacking_watch.py turns them on (mode "forced",
# via config/titlebar.toml) while the focused workspace uses the stacking layout.
# macOS-style buttons on the left.
[appearance.title_bar]
mode = "off"                    # overridden by config/titlebar.toml (forced in stacking)
height = 24
font = "CaskaydiaCove NF Bold 9"
button_position = "left"        # macOS-style
buttons = ["maximize", "minimize", "close"]   # from the title outward: close is leftmost
button_corner_radius = 100      # perfect circles (clamped to half the button size)
button_glyph = "hover"          # x / □ / _ symbols appear only while the pointer is over a button
button_background = true

# ---------------------------------------------------------------- animations
# Hyprland-style motion using umbriel's built-in styles (popin / slide) driven by
# Hyprland's bezier curves. No animation `effect` is set on purpose: an effect replaces
# the built-in style, so popin/slide would be lost.
# Curves: a name from [animation.beziers]/[animation.springs], "x1,y1,x2,y2", or
# "spring:<damping>,<stiffness>" (damping < 1 overshoots).
[animation]
enabled = true
duration_ms = 280
curve = "easeOutQuint"

[animation.beziers]
easeOutQuint = [0.23, 1.0, 0.32, 1.0]     # Hyprland default "easeOutQuint"
easeInOutCubic = [0.65, 0.05, 0.36, 1.0]  # Hyprland default "easeInOutCubic"
almostLinear = [0.5, 0.5, 0.75, 1.0]      # Hyprland default "almostLinear"
overshot = [0.05, 0.9, 0.1, 1.05]         # classic Hyprland "myBezier" with a small overshoot
smoothIn = [0.36, 0.0, 0.66, -0.56]       # slight anticipation before leaving
quick = [0.15, 0.0, 0.1, 1.0]
snap = [0.2, 0.9, 0.25, 1.0]                # fast start, short tail: lands quickly

[animation.springs]
popSpring = { damping = 0.74, stiffness = 900 }   # lively pop with one soft bounce
glide = { damping = 0.95, stiffness = 750 }       # smooth, no visible bounce

# Open: grow from 85% with a soft bounce while fading in (Hyprland: windowsIn popin 87%).
[animation.windows_in]
style = "popin"
scale = 0.85
curve = "popSpring"

# Close: shrink toward 88% while fading out, quick and clean (Hyprland: windowsOut popin).
[animation.windows_out]
style = "popin"
scale = 0.88
curve = "smoothIn"
duration_ms = 130

# Bezier on purpose (not a spring): a released touchpad swipe keeps the finger's speed only
# with a spring curve, which made swipes fling across several windows.
[animation.windows_move]
curve = "snap"
duration_ms = 260

[animation.windows_resize]
curve = "easeOutQuint"
duration_ms = 290

# Workspaces slide (Hyprland: workspaces slide).
[animation.workspaces]
style = "slide"
curve = "snap"
duration_ms = 280

[animation.overview]
curve = "glide"
workspace_curve = "easeOutQuint"

# Scratchpad: the rest of the screen blurs and dims so it is obvious a scratchpad is open.
[animation.scratchpad]
curve = "popSpring"
blur = true
dim = 0.35

# Focus-border colour fade (Hyprland: border easeOutQuint).
[animation.border]
curve = "easeOutQuint"
duration_ms = 260

[animation.windows_opacity]
curve = "easeOutQuint"
duration_ms = 210

[animation.dialogs]
curve = "easeOutQuint"
dim = 0.3
