# Processes spawned once at startup (each entry runs as a shell command).
# Keep the whole list in this one file.

[general]
autostart = [
  "~/.config/umbriel/scripts/set_layout.py --init",  # create workspaces.state.toml if missing
  "noctalia",                                       # shell (see config/noctalia.toml)
  "wl-paste --type text --watch cliphist store",
  "wl-paste --type image --watch cliphist store",
  "echo 'Xft.dpi: 125' | xrdb -merge",              # scaling for xorg apps
  "wl-clip-persist --clipboard regular",            # keep clipboard after programs close
  "~/.config/umbriel/scripts/swayidle_runner.sh",
  "~/.config/umbriel/scripts/stacking_watch.py",  # title bars in the stacking layout
  "~/.config/umbriel/scripts/tab_group_watch.py", # new windows open inside the focused tab group
  "~/scripts/battery_watcher.sh",
  "~/scripts/system_resume.sh restore",
  "paplay ~/.nix-profile/share/sounds/ocean/stereo/desktop-login.oga",
]
