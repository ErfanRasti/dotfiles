# Liquid glass (macOS-like) look.
# - Frosted body: appearance.blur (config/appearance.toml) + window opacity (config/rules.toml).
# - Edge: plain colored border (appearance.border_width), no shader rim.
# - Sheen: the "liquid_glass" WINDOW shader (effects/liquid_glass/): edge light + top gloss.

[effects]
window = "liquid_glass"
max_fps = 30 # cap border-effect redraws (the Spotify wave) to save GPU

# Spotify gets the audio-reactive wave border instead (effects/spotify_wave/).
[[window_rule]]
match.app_id = "^spotify$"
border_effect = "spotify_wave"

# Blur is the cheap "optimized" kind (appearance.blur.optimized = true): a cached blur of the
# wallpaper. Set it to false for live "x-ray" blur of the windows behind (costs more GPU).

# Video and games stay fully opaque.
[[window_rule]]
match.content_type = "video"
opacity = 1.0
window_effect = ""

[[window_rule]]
match.content_type = "game"
opacity = 1.0
window_effect = ""

[[window_rule]]
match.app_id = ["^mpv$", "^vlc$", "^steam_app_.*$", "^gamescope$"]
opacity = 1.0
window_effect = ""
