# Named workspaces, in order (workspace 1, 2, ...). This is the ONLY place the names live:
# rules refer to workspaces by number, and scripts/set_layout.py builds the list umbriel loads
# (workspaces.state.toml) from this file, keeping each workspace's current layout.
# Rename/reorder here; it applies at the next login or layout key press.

[[workspace]]
name = "En"
layout.mode = "scrolling"

[[workspace]]
name = "Ma"
layout.mode = "scrolling"

[[workspace]]
name = "We"
layout.mode = "scrolling"

[[workspace]]
name = "Ex"
layout.mode = "scrolling"
