# Lockscreen layout, designed on a 1536x864 logical screen, modelled on a
# reference design: "L O C K E D" over a tilted card stack (clock, date, volume,
# battery tiles), an audio visualizer over a compact login box with the
# kitty sitting on its hint bar (drawn last, so in front), the week's weather top-left
# mirroring a month calendar top-right, and a media player bottom-left. The kitty lives in ./stickers (path relative to $HOME).
# The battery tile's text is filled in by ~/.config/noctalia/scripts/lock_battery.sh.
# Portable across machines: this is the design on a 1536x864 logical canvas
# (placement_width/height). Edit it here at that size. lock_battery.sh fits it to
# each machine's screen: it writes a copy into ~/.local/state/noctalia/settings.toml
# scaled uniformly by min(W/1536, H/864), box sizes included, and centered, so the
# aspect ratio holds on 16:9, 16:10, 3:2, any output scale (noctalia alone would
# stretch x and y apart and keep box sizes). It refits on its own when this
# section changes or the screen size changes. No `output` (except the login box),
# so the layout isn't tied to one connector name.
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-weather",
  "lockscreen-media",
  "lockscreen-title",
  "lockscreen-card-back",
  "lockscreen-card",
  "lockscreen-time",
  "lockscreen-date",
  "lockscreen-volume",
  "lockscreen-battery-tile",
  "lockscreen-battery",
  "lockscreen-visualizer",
  "lockscreen-login-back",
  "lockscreen-login-box@eDP-1",
  "lockscreen-kitty-caption",
  "lockscreen-calendar",
  "lockscreen-kitty",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

# 20px from the screen edge, the calendar's top edge, and the same tile as the
# desktop's forecast (256x256, same content and text size): the week-weather
# plugin in week mode, the next hours' temperatures, then today and the next 6
# days (min, avg, max). Content `width` wide and ~223 tall, so it renders at scale 1.
[lockscreen_widgets.widget.lockscreen-weather]
box_height = 256.0
box_width = 256.0
cx = 148.0
cy = 296.0
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "dotfiles/week-weather:week"

[lockscreen_widgets.widget.lockscreen-weather.settings]
