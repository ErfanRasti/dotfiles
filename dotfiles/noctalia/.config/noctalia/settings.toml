[desktop_widgets]
schema_version = 2
# Minimal, compact desktop in the lockscreen's style: tiles in surface colours,
# text in on_surface with the shell font.
#
# One design on a 1536x864 canvas (placement_width/height). On other screens
# ~/.config/noctalia/scripts/desktop_fit.sh (see [hooks]) scales it to the
# screen size noctalia reports (as for the lockscreen), uniformly by
# min(W/1536, H/864), boxes included, and keeps each widget's distance to its
# nearest screen edges, so corners stay corners on any size, aspect or scale.
#
#   top-left    : one card, time over date on the left, the weather on the same rows on the right
#   top-right   : calendar, and the week's weather under it
#   bottom-left : media (hidden when nothing plays)
widget_order = [
  "desktop-clock",
  "desktop-calendar",
  "desktop-forecast",
  "desktop-media",
]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

# ── Top-left card, x 24–336, y 52–148 (24px below the 28px bar) ───────────────
# One widget, the week-weather plugin's "card" mode: time over date on the left,
# icon and temperature over "condition · low/high" on the right, 16px inside the
# card. Both sides share the same two rows (44 + 20 tall, same font sizes), so
# the time lines up with the temperature and the date with the condition.
# Content is `width` x 64, the box that plus the padding, so it renders at scale 1;
# 280 keeps the two sides close while the longest caption still fits.
[desktop_widgets.widget.desktop-clock]
box_height = 96.0
box_width = 312.0
cx = 180.0
cy = 100.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "dotfiles/week-weather:week"

[desktop_widgets.widget.desktop-clock.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_padding = 16
background_radius = 16
mode = "card"
width = 280

# ── Top-right: calendar, x 1256–1512, y 52–348 ────────────────────────────────

[desktop_widgets.widget.desktop-calendar]
box_height = 296.0
box_width = 256.0
cx = 1384.0
cy = 200.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "calendar"

[desktop_widgets.widget.desktop-calendar.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_padding = 10
background_radius = 16
show_events = false
show_week_numbers = false

# ── Right, under the calendar: the week's weather, x 1256–1512, y 364–620 ─────
# The week-weather plugin (~/.local/share/noctalia/plugins/week-weather): today's
# temperature hour by hour, then today and the next 6 days (min, avg, max). Now
# and today's low/high are on the top-left card already. Its content is `width`
# wide and ~225 tall; the box is that plus the padding, so it renders at scale 1.
# Its center is below the canvas middle, so desktop_fit.sh would pin it to the
# bottom edge; "anchor: top" keeps it 16px under the calendar on any screen.
[desktop_widgets.widget.desktop-forecast]
box_height = 256.0
box_width = 256.0
cx = 1384.0
cy = 492.0 # anchor: top
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "dotfiles/week-weather:week"

[desktop_widgets.widget.desktop-forecast.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_padding = 14
background_radius = 16
mode = "week"
width = 228

# ── Bottom-left: media, x 24–280, y 664–776 (clear of the dock) ───────────────

[desktop_widgets.widget.desktop-media]
box_height = 112.0
box_width = 256.0
cx = 152.0
cy = 720.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "media_player"

[desktop_widgets.widget.desktop-media.settings]
album_art_background = false
background = true
background_color = "surface"
background_opacity = 0.92
background_padding = 8
background_radius = 16
hide_when_no_media = true
layout = "horizontal"
shadow = false

[dock]
