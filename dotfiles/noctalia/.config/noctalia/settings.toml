[desktop_widgets]
schema_version = 2
# Minimal, compact desktop in the lockscreen's style: tiles in surface colours,
# text in on_surface with the shell font.
#
# One design on a 1536x864 canvas (placement_width/height). On other screens
# ~/.config/noctalia/scripts/desktop_fit.sh (see [hooks]) scales it uniformly by
# min(W/1536, H/864), boxes included, and keeps each widget's distance to its
# nearest screen edges, so corners stay corners on any size, aspect or scale.
#
#   top-left    : one card, time and date on the left, weather on the right
#   top-right   : calendar
#   bottom-left : media (hidden when nothing plays)
widget_order = [
  "desktop-card",
  "desktop-time",
  "desktop-date",
  "desktop-weather",
  "desktop-calendar",
  "desktop-media",
]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

# ── Top-left card, x 24–376, y 52–148 (24px below the 28px bar) ───────────────
# A blank label is the card (as on the lockscreen). Time and date stack on the
# left, 16px inside it; the weather sits on the right, centred on the card.
# Clocks with center_text = false start at their box's left edge; both boxes are
# wider than their text, so the text fills the height and the left edges line up.

[desktop_widgets.widget.desktop-card]
box_height = 96.0
box_width = 352.0
cx = 200.0
cy = 100.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "label"

[desktop_widgets.widget.desktop-card.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_radius = 16
description = ""
shadow = false
title = " "

# y 66–110
[desktop_widgets.widget.desktop-time]
box_height = 44.0
box_width = 136.0
cx = 108.0
cy = 88.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "clock"

[desktop_widgets.widget.desktop-time.settings]
background = false
center_text = false
clock_style = "digital"
color = "on_surface"
format = "{:%H:%M}"
shadow = false

# y 114–134
[desktop_widgets.widget.desktop-date]
box_height = 20.0
box_width = 136.0
cx = 108.0
cy = 124.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "clock"

[desktop_widgets.widget.desktop-date.settings]
background = false
center_text = false
clock_style = "digital"
color = "on_surface"
format = "{:%a,  %b  %d}"
shadow = false

# On the card's right side. The box has the widget's own aspect (180x72 = 2.5:1)
# so the content fills it. Noctalia left-aligns the text in a fixed frame and
# clips it at the frame's right edge (no setting for either), so the card reaches
# 16px past that edge: any reading stays inside the card. Box x 210–360, y 70–130.
[desktop_widgets.widget.desktop-weather]
box_height = 60.0
box_width = 150.0
cx = 285.0
cy = 100.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "weather"

[desktop_widgets.widget.desktop-weather.settings]
background = false
color = "on_surface"
shadow = false
show_forecast = false

# ── Top-right: calendar, x 1256–1512, y 52–348 ────────────────────────────────

[desktop_widgets.widget.desktop-calendar]
box_height = 296.0
box_width = 256.0
cx = 1384.0
cy = 200.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
