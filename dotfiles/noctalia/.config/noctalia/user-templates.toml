[theme.templates]
enable_builtin_templates = true
enable_community_templates = true
builtin_ids = ["emacs"]
community_ids = ["neovim", "vscode", "telegram", "obs"]

[theme.templates.custom_colors]
red = { color = "#f13c40", blend = true }
green = { color = "#41c257", blend = true }
blue = { color = "#0e85f0", blend = true }
mint = { color = "#07c2ac", blend = true }
teal = { color = "#02bbc5", blend = true }
cyan = { color = "#03b9db", blend = true }
indigo = { color = "#5b55e6", blend = true }
purple = { color = "#bd30d4", blend = true }
pink = { color = "#ed3053", blend = true }
yellow = { color = "#edc005", blend = true }
orange = { color = "#fb8d2c", blend = true }
brown = { color = "#a57d5a", blend = true }
black = { color = "#000000", blend = true }
white = { color = "#ffffff", blend = true }

[theme.templates.user.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/config/colors.kdl'

[theme.templates.user.umbriel]
input_path = '~/.config/matugen/templates/umbriel-colors.toml'
output_path = '~/.config/umbriel/config/colors.toml'
post_hook = 'if pgrep -x umbriel >/dev/null; then umbriel msg config-reload; fi'

[theme.templates.user.umbriel_spotify_wave]
input_path = '~/.config/matugen/templates/umbriel-spotify-wave.glsl'
output_path = '~/.config/umbriel/config/spotify_wave.glsl'
post_hook = 'if pgrep -x umbriel >/dev/null; then umbriel msg config-reload; fi'

[theme.templates.user.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/config/colors.lua'
post_hook = 'if pgrep -x hyprland;then hyprctl reload;fi'

[theme.templates.user.hyprlock]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/config/colors.conf'

# [theme.templates.user.wallpaper] # Blazing fast and beautiful
# command = "hyprctl"
# arguments = ["hyprpaper", "reload", ","]
# set = false

# [theme.templates.user.wallpaper] # Animated nad nice llok
# command = "swww"
# arguments = ["img", "--transition-type", "center"]
# set = false

[theme.templates.user.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
# `post_hook` is not needed because waybar handles it using `reload_style_on_change`
# post_hook = 'pkill waybar;setsid -f waybar >/dev/null 2>&1'

[theme.templates.user.swaync]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/swaync/colors.css'
post_hook = 'if pgrep -x swaync >/dev/null 2>&1;then swaync-client -rs;fi'

[theme.templates.user.swayosd]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/swayosd/colors.css'
post_hook = 'if pgrep -x swayosd-server >/dev/null 2>&1;then pkill swayosd-server;setsid -f swayosd-server >/dev/null 2>&1;fi'

[theme.templates.user.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/settings/colors.rasi'

[theme.templates.user.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[theme.templates.user.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[theme.templates.user.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[theme.templates.user.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
# post_hook = 'gsettings set org.gnome.desktop.interface color-scheme prefer-{{mode}};~/.config/matugen/scripts/gtk_themes_reload.sh'
post_hook = 'gsettings set org.gnome.desktop.interface color-scheme prefer-{{mode}}'

[theme.templates.user.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/matugen.conf'
# Not `kitty +kitten themes`: it needs network and pins kitty to a theme copy.
post_hook = '~/.config/matugen/scripts/kitty_reload.sh'

[theme.templates.user.opencode]
input_path = '~/.config/matugen/templates/opencode-colors.json'
output_path = '~/.config/opencode/themes/matugen.json'

[theme.templates.user.tmux]
input_path = '~/.config/matugen/templates/tmux-colors.conf'
output_path = '~/.config/tmux/matugen.conf'
post_hook = 'if tmux info >/dev/null 2>&1; then tmux source-file ~/.config/tmux/matugen.conf; fi'

[theme.templates.user.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 -x btop || true'

# Uses terminal palette slots (see the kitty template), so yazi recolors live.
[theme.templates.user.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[theme.templates.user.television]
input_path = '~/.config/matugen/templates/television.toml'
output_path = '~/.config/television/themes/matugen.toml'

[theme.templates.user.zellij]
input_path = '~/.config/matugen/templates/zellij-theme.kdl.tera'
output_path = '~/.config/zellij/themes/matugen.kdl'
# Add this line to get hot-reloading. Without it, the new theme will only
# appear on next start
post_hook = 'touch ~/.config/zellij/config.kdl'

[theme.templates.user.zathura]
input_path = '~/.config/matugen/templates/zathura-colors'
output_path = '~/.config/zathura/zathurarc'
post_hook = '~/.config/matugen/scripts/zathura_reload.sh'

[theme.templates.user.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen-theme'
post_hook = "if pgrep -x cava >/dev/null; then pkill -USR1 cava; fi"

[theme.templates.user.ashell]
input_path = '~/.config/matugen/templates/ashell-colors.ini'
output_path = '~/.config/ashell/config.toml'

[theme.templates.user.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.config/ghostty/themes/Matugen'
post_hook = 'systemctl --user reload app-com.mitchellh.ghostty.service 2>/dev/null || true'

[theme.templates.user.micro]
input_path = '~/.config/matugen/templates/micro.micro'
output_path = '~/.config/micro/colorschemes/matugen.micro'

[theme.templates.user.starship]
input_path = '~/.config/matugen/templates/starship-colors.toml'
output_path = '~/.config/starship.toml'

[theme.templates.user.obs]
input_path = '~/.config/matugen/templates/obs-colors.obt'
output_path = '~/.config/obs-studio/themes/matugen.obt'

# Pywalfox reads pywal's fixed slots, not roles: it expects color0 to be dark
# in both modes and derives its own light theme (text = color0, accents =
# color3/5, field = color7). Slots therefore use explicit .dark/.light
# variants, and the hook flips the extension's mode to match matugen.
[theme.templates.user.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox {{mode}}; pywalfox update'

[theme.templates.user.zed]
input_path = '~/.config/matugen/templates/zed-colors.json'
output_path = '~/.config/zed/themes/matugen.json'

# spicetify-reload (spicetify.nix) applies the colors and reloads the open Spotify
[theme.templates.user.spicetify]
input_path = '~/.config/matugen/templates/spicetify-comfy.ini'
output_path = '~/.config/spicetify/Themes/Comfy/color.ini'
post_hook = 'spicetify-reload'

[theme.templates.user.vicinae]
input_path = '~/.config/matugen/templates/vicinae.ini'
output_path = '~/.local/share/vicinae/themes/matugen.toml'
post_hook = "if pgrep -x vicinae >/dev/null; then systemctl --user restart vicinae.service; fi"

[theme.templates.user.dgop]
input_path = '~/.config/matugen/templates/dgop-colors.json'
output_path = '~/.config/dgop/colors.json'

[theme.templates.user.mango]
input_path = '~/.config/matugen/templates/mango.conf'
output_path = '~/.config/mango/config/colors.conf'
post_hook = 'if command -v mmsg >/dev/null; then mmsg -d reload_config; fi'

# Neovim reads this to pick tokyonight-night (dark) or tokyonight-day (light)
# and watches it to switch live, so no post_hook is needed.
[theme.templates.user.nvim]
input_path = '~/.config/matugen/templates/nvim-mode'
output_path = '~/.local/state/nvim/matugen-mode'

# Papirus-Matugen (system) and Adwaita-Matugen (Nautilus) icon themes, with Adwaita's
# folders in the primary palette. The template lists its tones; folder_icons.py builds them.
[theme.templates.user.folder_icons]
input_path = '~/.config/matugen/templates/folder-icons-tones.txt'
output_path = '~/.cache/matugen/folder-icons-tones.txt'
post_hook = '~/.config/matugen/scripts/folder_icons.py ~/.cache/matugen/folder-icons-tones.txt'
